<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Family calendar">
  <!-- /family app icon (original mark). Blue = fam-primary-blue #2178AF, coral = fam-accent-coral #F66951.
       All glyph geometry sits inside the central 80% circle (maskable safe zone), so the
       maskable variant is this same art on a full-bleed square (rx="0"). -->
  <rect width="512" height="512" rx="112" fill="#2178AF"/>
  <!-- calendar page -->
  <rect x="116" y="148" width="280" height="240" rx="36" fill="#FFFFFF"/>
  <!-- binder rings (cut into the page top) -->
  <rect x="164" y="124" width="24" height="64" rx="12" fill="#2178AF"/>
  <rect x="324" y="124" width="24" height="64" rx="12" fill="#2178AF"/>
  <!-- header rule -->
  <rect x="140" y="208" width="232" height="8" rx="4" fill="#2178AF"/>
  <!-- day grid, 3 x 2 -->
  <rect x="156" y="244" width="36" height="36" rx="9" fill="#2178AF"/>
  <rect x="238" y="244" width="36" height="36" rx="9" fill="#2178AF"/>
  <rect x="320" y="244" width="36" height="36" rx="9" fill="#2178AF"/>
  <rect x="156" y="316" width="36" height="36" rx="9" fill="#2178AF"/>
  <!-- today -->
  <rect x="238" y="316" width="36" height="36" rx="18" fill="#F66951"/>
  <rect x="320" y="316" width="36" height="36" rx="9" fill="#2178AF"/>
</svg>
